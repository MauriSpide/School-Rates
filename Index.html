<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Itinerario Canvas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--bg:#f8f9fc;--sf:#fff;--bd:#e8eaf0;--tx:#171923;--t2:#747b8b;--ac:#4169e1;--ok:#2f9e6a;--wn:#b87400;--er:#d03b3b;--r:14px;--sh:0 1px 3px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#17171c;--sf:#222229;--bd:#34343e;--tx:#f0eff4;--t2:#a2a2b0;--ac:#9d90ff;--ok:#5ccf9b;--wn:#f0b04a;--er:#f08a8a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:600px;margin:auto;padding:0 14px 96px}
#hd{display:flex;justify-content:space-between;align-items:center;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}#hd b{font:700 19px system-ui,sans-serif}
#fb{background:var(--wn);color:#fff;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-weight:700}#fb:empty{display:none}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:0 0 10px;box-shadow:var(--sh)}
.hero{color:#2b2b30;background:#e9e5ff}h2,h3{margin:0 0 8px;font-weight:700}small,.t2{color:var(--t2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);padding:0 12px;transition:transform .15s,background .15s}
button:hover{background:var(--bd)}button:active{transform:scale(.95)}button:disabled{opacity:.4}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.b1{background:var(--ac);color:#fff;border-color:var(--ac)}.b1:hover{background:var(--ac);filter:brightness(1.1)}
input,select,textarea{width:100%;min-height:40px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}label{display:block;margin:0 0 8px;font-weight:700}label>*{font-weight:400;margin-top:3px}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
.row{display:flex;gap:8px;align-items:center}.row>.fl{flex:1}.fl{min-width:0}.wrap{flex-wrap:wrap}
.ch{display:inline-block;padding:1px 8px;border-radius:9px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);font-size:12px}
.tk{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);transition:opacity .3s,transform .3s}.tk.dn{opacity:.55;transform:scale(.98)}.tk.dn b{text-decoration:line-through}
.ck{width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border-radius:9px;border:2px solid var(--ac);font-weight:700;color:#fff}.dn .ck{background:var(--ok);border-color:var(--ok)}
.ib{min-width:40px;padding:0}.ov{color:var(--er);font-weight:700}.wn{color:var(--wn);font-weight:700}
#nv{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
#nv button{flex:1;border:0;border-radius:0;min-height:56px;background:none;font-size:12px}#nv button[aria-current=page]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:26px;z-index:6;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}.ovl.on{opacity:1;pointer-events:auto}
#sh{background:var(--bg);width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s}.on #sh{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 10px}.er{color:var(--er);font-weight:700;min-height:1em}
#md{align-items:center;padding:16px}#mc{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:420px;text-align:center}
#tt{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}#tt.on{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.chips button{white-space:nowrap}.chips [aria-pressed=true]{background:var(--ac);color:#fff}
.sl{width:70px;height:56px;margin:14px auto 4px;border-radius:50% 50% 45% 45%;background:var(--ac);color:#fff;position:relative;display:grid;place-items:center;transform:scale(var(--s,1));animation:bn 2.4s ease-in-out infinite}.sl.mi{width:30px;height:24px;margin:0;display:inline-grid;font-size:9px;vertical-align:middle}
.ht{position:absolute;top:-16px;font-size:20px}.mi .ht{top:-9px;font-size:10px}.fc{font-weight:700}
@keyframes bn{50%{transform:scale(var(--s,1)) translateY(-5px) scaleY(1.06)}}@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.25)}}
.rv{font-size:70px;animation:pop .7s}.board{position:relative;height:520px;border:2px dashed var(--bd);border-radius:var(--r);overflow:hidden}
.nt{position:absolute;width:150px;height:130px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.2);color:#2b2b30;display:flex;flex-direction:column}.nh{touch-action:none;cursor:grab;display:flex;justify-content:space-between;padding:2px 6px;background:rgba(0,0,0,.08)}
.nt textarea{flex:1;border:0;background:none;resize:none;color:#2b2b30}.nt button{min-height:24px;border:0;background:none;padding:0 4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}.wk button{display:block;padding:4px 0;text-align:center;line-height:1.2}.wk [aria-pressed=true]{background:var(--ac);color:#fff}
.in{animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}.st{font-size:28px;margin:0 4px}
#hd .ib{border:0;background:none}.lg{color:var(--ac);display:grid}.av{width:40px;height:40px;min-height:40px;border-radius:50%;padding:0;border:0;background:linear-gradient(135deg,#c9d6ff,#e6d6ff);color:#2b3a8c;font:700 12px system-ui}
.pill{display:flex;align-items:center;gap:2px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);box-shadow:var(--sh);padding:4px 6px;margin-bottom:18px}.pill b{text-align:center;font-weight:600}.pill .ib{border:0;background:none;color:var(--t2)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sh h3{margin:0;font-size:19px}.lk{border:0;background:none;color:var(--ac);font-weight:600;padding:0 4px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.dy{flex:0 0 48px;min-height:72px;border:0;border-radius:14px;background:color-mix(in srgb,var(--t2) 14%,var(--sf));padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t2)}.dy b{font-size:19px;color:var(--tx)}.dy[aria-pressed=true]{background:var(--ac);color:#fff}.dy[aria-pressed=true] b{color:#fff}.dot{width:5px;height:5px;border-radius:50%;background:#8a93a8}.dot.o{background:#f08a3c}
.tr{display:flex;gap:12px;align-items:center;padding:6px 0;min-height:52px}.tr.dn{opacity:.6}.tr.dn b{text-decoration:line-through}.tr .ck{border-radius:50%;border-color:#b8bfd0}.tr.dn .ck{background:var(--ac);border-color:var(--ac)}.tr small{display:inline-flex;gap:4px;align-items:center}.tr .tx{flex:1;text-align:left;border:0;background:none;min-height:44px;padding:0}.tr .tx:hover{background:none}.pr{background:#fde3e3;color:#a12a2a;border-radius:8px;padding:0 6px;font-size:11px;font-weight:700}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}.pc{flex:0 0 78%;max-width:260px;scroll-snap-align:start;border:0;border-radius:20px;padding:16px;text-align:left;min-height:170px;display:block;color:#171923;white-space:normal}.pc h4{margin:8px 0 2px;font-size:17px}.pc small{color:#3d4354}.pc .bar{background:rgba(255,255,255,.65)}
.nts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sn{border:0;border-radius:6px;min-height:110px;padding:12px;color:#2b2b30;font:15px/1.3 "Bradley Hand","Segoe Print","Comic Sans MS",cursive;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.12);display:block;white-space:normal;overflow:hidden}
#nv button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2)}#nv button[aria-current=page]{box-shadow:none}
.cat{position:relative;width:var(--w,200px);max-width:100%;aspect-ratio:10/9;border-radius:18px;overflow:hidden;background:#fbf7e9;flex:0 0 auto;margin:0 auto}.cat img{width:100%;height:100%;display:block}.ac{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--w,200px)*.17);line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.pt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;height:auto;min-height:0}.pt img{width:100%;border-radius:10px}.pt[aria-pressed=true]{border:2px solid var(--ac)}.pt:disabled img{filter:grayscale(1) brightness(.7)}#mc{max-height:86vh;overflow:auto}#mc .tk{text-align:left}

/* ===== Itinerario Canvas · Premium visual refresh ===== */
:root{
  --bg:#f6f8fc;--sf:#ffffff;--bd:#e7ebf3;--tx:#171b2b;--t2:#737c91;
  --ac:#4268df;--ok:#278b62;--wn:#b87316;--er:#c93f54;
  --r:18px;--sh:0 5px 18px rgba(35,49,88,.055);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#11141d;--sf:#1b202c;--bd:#30394b;--tx:#f2f4fa;--t2:#a6b0c4;
  --ac:#91a8ff;--ok:#65d5a0;--wn:#f3bd65;--er:#ff8c9b;
  --sh:0 6px 20px rgba(0,0,0,.18);color-scheme:dark;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 0% 0%,rgba(90,123,235,.055),transparent 34rem),
    var(--bg);
  color:var(--tx);letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#app{max-width:640px;padding:0 18px 112px}
#hd{
  padding:16px 0 18px;gap:10px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
#hd .row{gap:10px}
#hd b{font-size:18px;letter-spacing:-.035em}
.lg{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;
  background:linear-gradient(145deg,#e6ecff,#f1eaff);color:#4268df}
:root[data-theme=dark] .lg{background:#2a3453;color:#b8c7ff}
.av{width:42px;height:42px;min-height:42px;background:linear-gradient(135deg,#d5e0ff,#f1d9ff);
  box-shadow:inset 0 0 0 1px rgba(66,104,223,.12);font-size:11px}
button{
  min-height:42px;border-radius:13px;border-color:var(--bd);
  box-shadow:0 1px 2px rgba(23,27,43,.025);
  transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.975)}
button:hover{border-color:color-mix(in srgb,var(--ac) 24%,var(--bd))}
.b1{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 78%,#7d8fff));
  box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 20%,transparent);border-color:transparent}
.b1:hover{filter:brightness(1.035);box-shadow:0 7px 16px color-mix(in srgb,var(--ac) 24%,transparent)}
.card{
  padding:16px;border:1px solid color-mix(in srgb,var(--bd) 82%,transparent);
  border-radius:20px;box-shadow:var(--sh);margin-bottom:12px;
}
.hero{
  background:linear-gradient(135deg,#e8edff 0%,#f0eaff 58%,#fce9f2 100%);
  border:0;padding:20px;color:#252d4b;box-shadow:0 8px 22px rgba(91,106,180,.09);
}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#293451,#30283f 65%,#3a2938);color:var(--tx)}
h2{font-size:24px;letter-spacing:-.045em;line-height:1.18}
h3{font-size:19px;letter-spacing:-.035em;line-height:1.25}
small{font-size:12px;letter-spacing:0}
.sh{margin:25px 0 12px;gap:10px}
.sh h3{font-size:19px;font-weight:750;letter-spacing:-.035em}
.lk{min-height:36px;padding:0 2px;font-size:13px}
.pill{
  padding:7px 8px;border-radius:18px;gap:4px;margin-bottom:22px;
  border-color:var(--bd);box-shadow:0 4px 14px rgba(32,44,77,.045);
}
.pill b{font-size:13px;letter-spacing:-.02em}
.pill .ib{min-width:36px;min-height:36px}
.days{gap:9px;padding:2px 1px 6px}
.dy{
  flex-basis:49px;min-height:78px;border-radius:16px;gap:4px;
  background:color-mix(in srgb,var(--t2) 8%,var(--sf));color:var(--t2);
}
.dy small{text-transform:capitalize;font-size:11px}
.dy b{font-size:19px;font-weight:700;letter-spacing:-.04em}
.dy[aria-pressed=true]{
  background:linear-gradient(160deg,#4c75ec,#365bd1);color:#fff;
  box-shadow:0 6px 14px rgba(65,101,220,.24);
}
.dy[aria-pressed=true] b{color:#fff}
.dot{width:5px;height:5px;background:#9aa4ba}
.dot.o{background:#f49a53}
.tr{gap:11px;padding:9px 0;min-height:62px}
.tr .ck,.ck{
  width:30px;min-width:30px;height:30px;min-height:30px;border-radius:50%;
  border:1.7px solid #b8c1d3;background:var(--sf);color:white;box-shadow:none;
}
.tr .ck[aria-pressed=true],.dn .ck{background:var(--ac);border-color:var(--ac)}
.tr .tx{font-size:14px;line-height:1.4;letter-spacing:-.018em}
.tr .tx b{font-weight:650}
.tr small{font-size:11px;color:var(--t2);margin-top:3px}
.tr .tx:hover{color:var(--tx)}
.ch{padding:2px 7px;border:0;border-radius:7px;font-weight:650;font-size:10px}
.pr{padding:2px 7px;border-radius:7px}
.hs{gap:12px;padding:2px 2px 8px;scroll-padding:2px}
.pc{
  flex-basis:78%;max-width:275px;min-height:178px;border-radius:20px;padding:17px;
  box-shadow:0 7px 18px rgba(40,50,80,.07);transition:transform .18s,box-shadow .18s;
}
.pc:active{transform:scale(.98)}
.pc h4{font-size:17px;line-height:1.25;letter-spacing:-.035em;margin:12px 0 5px}
.pc small{font-size:11px;line-height:1.4}
.pc .bar{height:7px;margin:12px 0 7px;background:rgba(255,255,255,.6)}
.nts{gap:9px}
.sn{
  min-height:118px;padding:12px 10px;border-radius:9px;font-size:13px;line-height:1.35;
  box-shadow:0 4px 9px rgba(37,42,63,.10);transform:rotate(-.6deg);
}
.sn:nth-child(3n+2){transform:rotate(.7deg)}
.sn:active{transform:scale(.98) rotate(0)}
#nv{
  padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--sf) 92%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid color-mix(in srgb,var(--bd) 75%,transparent);
  box-shadow:0 -7px 24px rgba(32,42,67,.045);
  gap:3px;
}
#nv button{
  min-height:57px;border-radius:14px;gap:4px;font-size:10px;font-weight:550;
  box-shadow:none;padding:5px 2px;color:var(--t2);
}
#nv button[aria-current=page]{
  background:color-mix(in srgb,var(--ac) 9%,var(--sf));color:var(--ac);
  font-weight:750;box-shadow:none;
}
#nv button[aria-current=page] svg{stroke-width:2.4}
#fab{
  right:19px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;min-height:56px;border-radius:19px;font-size:28px;
  box-shadow:0 9px 22px color-mix(in srgb,var(--ac) 28%,transparent);
}
input,select,textarea{
  min-height:44px;border-radius:13px;padding:10px 12px;
  border-color:var(--bd);background:var(--sf);outline:none;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 13%,transparent);
}
label{font-size:13px;margin-bottom:14px}
label>*{margin-top:6px}
#sh{
  max-width:640px;border-radius:26px 26px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 35px rgba(15,20,35,.12);
}
.grab{width:42px;height:5px;background:color-mix(in srgb,var(--t2) 30%,var(--bd));margin-bottom:15px}
#sh h2{margin-bottom:18px}
#sh .row{gap:10px;margin-top:14px}
#sh .row button{min-height:46px}
#md{backdrop-filter:blur(5px)}
#mc{border:1px solid var(--bd);box-shadow:0 15px 45px rgba(12,18,35,.2);border-radius:24px}
#tt{box-shadow:0 5px 20px rgba(0,0,0,.18);font-size:13px;font-weight:650}
#fb{border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:0 4px 12px rgba(184,116,0,.12)}
.chips{gap:7px;padding-bottom:3px}
.chips button{border-radius:999px;padding:0 14px;min-height:37px;font-size:12px}
.chips [aria-pressed=true]{box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 20%,transparent)}
.tk{padding:10px 0;gap:10px}
.tk:last-child{border-bottom:0}
.board{border-radius:18px;background:color-mix(in srgb,var(--sf) 60%,var(--bg));border-color:var(--bd)}
.nt{border-radius:10px;box-shadow:0 6px 15px rgba(35,42,63,.13)}
.wk{gap:5px}
.wk button{border-radius:12px;padding:7px 0;min-height:66px}
.wk [aria-pressed=true]{box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 20%,transparent)}
.bar{height:8px;border-radius:999px;background:color-mix(in srgb,var(--t2) 12%,var(--bd));margin:7px 0}
.bar i{border-radius:999px}
.st{font-size:25px}
@media(min-width:520px){
  #app{padding-left:22px;padding-right:22px}
  .nts{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:360px){
  #app{padding-left:12px;padding-right:12px}
  #hd b{font-size:16px}
  .sh h3{font-size:17px}
  .dy{flex-basis:43px}
  .nts{gap:6px}
  .sn{padding:9px 7px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}

</style></head><body><div id="app"><div id="hd"></div><div id="fb" role="status"></div><main id="mn"></main></div>
